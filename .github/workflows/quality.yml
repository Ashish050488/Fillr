name: Quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: jobfill-app
      - run: npm run typecheck
        working-directory: jobfill-app
      - run: npm run lint
        working-directory: jobfill-app
      - run: npm run format:check
        working-directory: jobfill-app
      - run: npm test
        working-directory: jobfill-app
